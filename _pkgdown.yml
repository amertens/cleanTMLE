url: https://amertens.github.io/cleanTMLE/

template:
  bootstrap: 5

reference:
  - title: The workflow
    desc: >
      Lock the specification, declare the estimand ladder, fit the
      propensity, assess support, map which estimands the design can
      deliver, simulate outcome-blind, estimate, report.
    contents:
      - create_analysis_lock
      - declare_estimand_ladder
      - fit_ps
      - assess_support
      - estimand_feasibility
      - simulate_support
      - estimate_effect
      - run_estimand_ladder
      - run_clean_tmle
      - design_report
      - create_contrast_locks

  - title: Design checks
    contents:
      - run_negative_control_ladder
      - check_process_indicators
      - estimate_design_precision

  - title: Outcome-blind candidate selection
    contents:
      - tmle_candidate
      - run_plasmode_feasibility
      - run_plasmode_dq_stress
      - select_tmle_candidate
      - select_variance_method

  - title: Sensitivity
    contents:
      - compute_evalue
      - run_delta_sensitivity

  - title: Nuisance models and learners
    contents:
      - build_sl_library
      - resolve_truncation_rule
      - sanitize_covariates
      - SL.glmnet.bounded
      - SL.glm.pca
      - SL.glm.pca5
      - SL.glm.pca10
      - SL.glmnet.ridge
      - SL.glmnet.enet

  - title: Plots and tables
    contents:
      - love_plot
      - forest_plot
      - clean_weight_diagnostics
      - make_table1
      - make_table2
      - attrition_table

  - title: Cumulative-risk grammar
    desc: The specify, identify, estimate pipeline for time-to-event risks.
    contents:
      - specify_models
      - identify_outcome
      - identify_treatment
      - identify_censoring
      - identify_competing_risk
      - identify_subject
      - identify_interval
      - estimate_ipwrisk
      - estimate_gcomprisk
      - estimate_aipwrisk
      - estimate_ipwhr
      - estimate_surv_tmle
      - estimate_lmtp

  - title: Locks, masking, persistence, data
    contents:
      - mask_outcome
      - unmask_outcome
      - save_lock
      - load_lock
      - sim_func1
